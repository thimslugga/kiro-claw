[project]
name = "kiro-claw"
version = "0.2.0"
description = "Chat ↔ JARVIS bridge with container isolation (Telegram, Discord)"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[ext]>=21.0",
    "discord.py>=2.3",
    "python-dotenv>=1.0",
    "croniter>=2.0",
    "aiohttp>=3.9",
]

[project.scripts]
kiro-claw = "src.main:main"
